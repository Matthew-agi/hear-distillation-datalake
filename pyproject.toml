[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hear-distillation-datalake"
version = "0.3.0"
description = "Hardware-aware audio distillation and direct Canon-ViT pretraining"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
  "adaptive-warmup @ git+https://github.com/Matthew-agi/adaptive-warmup.git@06d08944eee963473ba1fcdcb5521cd4c8c18fe9",
  "datasets>=3.0",
  "hf-transfer>=0.1.9",
  "huggingface-hub>=0.29",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "scipy>=1.12",
  "soundfile>=0.12",
  "timm>=1.0",
  "torch>=2.4",
  "transformers>=4.50",
  "wandb>=0.18",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "ruff>=0.9",
]

[project.scripts]
hear-distill = "hear_distill.cli:main"
hear-pretrain = "hear_distill.training.pretrain:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"
